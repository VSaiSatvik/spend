<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spend</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spend">
<meta name="theme-color" content="#E9ECE4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --paper:#E9ECE4; --card:#F8F9F4; --ink:#122720; --inkSoft:#42574E;
    --muted:#8B9A93; --line:#D5DACE; --accent:#1F6F5C; --flag:#8C3B26;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{font-family:var(--sans); color:var(--ink); min-height:100vh; min-height:100dvh;
    padding-top:env(safe-area-inset-top); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer;color:inherit;}
  input{font-family:inherit;}
  input:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .wrap{max-width:460px;margin:0 auto;}

  .head{padding:24px 20px 20px;}
  .navrow{display:flex;align-items:center;justify-content:space-between;}
  .navbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--inkSoft);font-size:20px;line-height:1;}
  .monthlbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--inkSoft);text-transform:uppercase;}
  .totalrow{margin-top:28px;display:flex;align-items:baseline;justify-content:center;}
  .cur{font-family:var(--mono);font-size:15px;color:var(--muted);margin-right:8px;}
  .big{font-family:var(--mono);font-size:54px;letter-spacing:-.03em;line-height:1;}
  .fils{font-family:var(--mono);font-size:24px;color:var(--muted);}
  .count{text-align:center;margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);}

  .bar{display:flex;gap:2px;height:10px;margin-top:24px;}
  .seg{border-radius:5px;min-width:6px;transition:opacity .15s;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .chip{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--inkSoft);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--card);}
  .chip.ask{border-color:var(--flag);color:var(--flag);border-style:dashed;}
  .chip .amt{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .chip.on .amt{color:var(--card);}
  .dot{width:7px;height:7px;border-radius:4px;flex-shrink:0;}
  .editcats{display:block;margin:14px auto 0;font-size:12px;color:var(--muted);text-decoration:underline;}

  /* budget track: the composition bar sits inside the month's budget */
  .track{position:relative;height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:22px;}
  .track .fill{position:absolute;inset:0 auto 0 0;display:flex;gap:2px;}
  .track.over{background:var(--flag);}
  .bline{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);}
  .bline .left{color:var(--inkSoft);}
  .bline .over{color:var(--flag);}
  .setbudget{display:block;margin:20px auto 0;font-size:12px;color:var(--muted);text-decoration:underline;}

  .toolrow{display:flex;gap:8px;margin-top:20px;}
  .toolrow button{flex:1;padding:10px 4px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);font-size:12px;color:var(--inkSoft);}

  /* charts */
  .amtrow{display:flex;align-items:baseline;gap:10px;margin-bottom:22px;}
  #bamt{flex:1;min-width:0;background:none;border:none;border-bottom:1px solid var(--line);
    outline:none;font-family:var(--mono);font-size:38px;letter-spacing:-.02em;color:var(--ink);padding-bottom:7px;}
  .donutwrap{position:relative;display:flex;justify-content:center;margin:4px 0 18px;}
  .dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;padding:0 46px;}
  .dcenter .lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);
    text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dcenter .val{font-family:var(--mono);font-size:25px;letter-spacing:-.02em;margin-top:3px;}
  .dcenter .sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
  .lrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line);}
  .lrow .nm{flex:1;font-size:14px;}
  .lrow .pc{font-family:var(--mono);font-size:11px;color:var(--muted);width:40px;text-align:right;}
  .lrow .am{font-family:var(--mono);font-size:14px;width:74px;text-align:right;}
  .lrow.dim{opacity:.4;}
  .stat{display:flex;gap:10px;margin:18px 0 4px;}
  .stat > div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;}
  .stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  .stat .v{font-family:var(--mono);font-size:17px;margin-top:5px;}
  .sechead{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);
    margin:24px 2px 10px;text-transform:uppercase;}

  /* search */
  #q{width:100%;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:16px;color:var(--ink);outline:none;}
  .qsum{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 4px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);}
  .qsum .t{font-size:15px;color:var(--ink);letter-spacing:0;}
  .qrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .qmid{flex:1;min-width:0;}
  .qn{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qd{display:block;font-size:11px;color:var(--muted);margin-top:3px;}
  .qa{font-family:var(--mono);font-size:15px;}
  .seg{border-radius:0;}
  .track .fill .seg:first-child{border-radius:6px 0 0 6px;}
  .track .fill .seg:last-child{border-radius:0 6px 6px 0;}
  .track .fill .seg:only-child{border-radius:6px;}

  .list{padding:0 20px 130px;}
  .daygrp{margin-bottom:20px;}
  .dayhead{display:flex;justify-content:space-between;padding:0 4px 8px;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);}
  .cardbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;}
  .del{padding:0 16px 12px;}
  .rowsep{border-top:1px solid var(--line);}
  .rname{flex:1;font-size:15px;}
  .rcat{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .ramt{font-family:var(--mono);font-size:15px;}
  .delbtn{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);color:var(--flag);font-size:13px;}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 24px;text-align:center;}
  .empty .t{font-size:15px;margin-bottom:6px;}
  .empty .s{font-size:13px;color:var(--muted);}
  .warn{margin:0 20px 12px;padding:12px 16px;border-radius:12px;background:#F6E3DE;color:var(--flag);font-size:13px;}

  .footer{position:fixed;left:0;right:0;bottom:0;padding:32px 20px calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 55%, rgba(233,236,228,0));}
  .addbtn{display:block;width:100%;max-width:420px;margin:0 auto;padding:16px;border-radius:16px;
    background:var(--ink);color:var(--card);font-size:15px;}

  .scrim{position:fixed;inset:0;background:rgba(18,39,32,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{width:100%;max-width:460px;background:var(--paper);border-radius:24px 24px 0 0;
    padding:20px 20px calc(28px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .sheettitle{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--inkSoft);}
  .cancel{font-size:14px;color:var(--muted);}
  .readout{display:flex;align-items:baseline;justify-content:center;margin-bottom:18px;}
  .readout .big{font-size:44px;}
  .muted-num{color:var(--muted);}
  #entry{width:100%;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:16px;color:var(--ink);outline:none;}
  .hint{font-size:12px;color:var(--muted);margin:8px 2px 16px;line-height:1.45;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin:0 2px 8px;}
  .eyebrow.ask{color:var(--flag);}
  .field{width:100%;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:16px;color:var(--ink);outline:none;margin-bottom:16px;}
  #date{font-family:var(--mono);}
  .savebtn{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:var(--card);font-size:15px;}
  .savebtn:disabled{background:var(--line);color:var(--muted);}

  .newrow{display:flex;gap:8px;margin:10px 0 16px;}
  .newrow input{flex:1;padding:12px 14px;border-radius:12px;background:var(--card);
    border:1px solid var(--line);font-size:16px;color:var(--ink);outline:none;}
  .newrow button{padding:0 18px;border-radius:12px;background:var(--accent);color:var(--card);font-size:14px;}
  .catrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .catrow input{flex:1;padding:10px 12px;border-radius:10px;background:var(--card);
    border:1px solid var(--line);font-size:16px;color:var(--ink);outline:none;}
  .catrow .used{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .catrow .kill{width:30px;height:30px;border-radius:15px;border:1px solid var(--line);color:var(--flag);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  var KEY = "expenses:v1";

  // Hues checked for colour-blind separation; grey is a reserved neutral for Other.
  var DEFAULT_CATS = [
    {id:"grocery", label:"Groceries",    color:"#0E8266"},
    {id:"food",    label:"Food",         color:"#C9821B"},
    {id:"gift",    label:"Gifts",        color:"#B43B2E"},
    {id:"car",     label:"Car & travel", color:"#3A6FD8"},
    {id:"home",    label:"Home & bills", color:"#7B3F9E"},
    {id:"other",   label:"Other",        color:"#8B9A93"}
  ];
  var PALETTE = ["#1B6E8C","#A65B2E","#4E7F3E","#B0357A","#5B52B5","#8A6D14","#2F7F72","#96324F"];

  var MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
  var WEEK = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  var RULES = {
    grocery:["grocery","groceries","supermarket","carrefour","lulu","spinneys","choithrams","waitrose",
             "union coop","nesto","viva","almaya","west zone","zoom","baqala","milk","bread","eggs","rice",
             "oil","atta","flour","sugar","salt","vegetables","veggies","fruits","veg","chips","chocolate",
             "chocolates","gum","chewing","snacks","biscuit","biscuits","yogurt","curd","paneer","chicken",
             "meat","fish","tissue","detergent","shampoo","soap","toothpaste","water bottle","ice tea",
             "iced tea","pooja","agarbatti","dates"],
    food:["food","restaurant","lunch","dinner","breakfast","brunch","dessert","crunch","cake","pastry",
          "ice cream","icecream","mcd","mcdonald","mcdonalds","kfc","burger","pizza","subway","shawarma",
          "biryani","sushi","ramen","noodles","dumpling","thai","chinese","indian","arabic","grill",
          "cafe","coffee","matcha","latte","starbucks","costa","tim hortons","arabica","boba","bubble tea",
          "juice","smoothie","shake","talabat","deliveroo","zomato","snack","dine","takeaway","bakery",
          "donut","croissant"],
    gift:["gift","gifts","present","birthday","anniversary","wedding","farewell","souvenir","flowers",
          "bouquet"],
    car:["car","fuel","petrol","diesel","adnoc","enoc","eppco","emarat","salik","parking","rta","nol",
         "metro","taxi","careem","uber","bolt","wash","car wash","tyre","tyres","tire","oil change",
         "garage","mechanic","battery","registration","mulkiya","toll","obd","number plate","tinting",
         "flight","hotel","visa"],
    home:["rent","dewa","electricity","water bill","internet","wifi","etisalat","bill","furniture","ikea",
          "home centre","cleaning","laundry","dry clean","maid","cylinder","bulb","curtains","mattress",
          "pillow","plumber","ac service","subscription","netflix","spotify","icloud","storage"]
  };
  var ORDER = ["gift","car","food","grocery","home"];

  // A category you create picks up a vocabulary based on what you named it.
  var CONCEPTS = {
    clothing:{names:["cloth","clothes","clothing","apparel","fashion","wardrobe","outfit","garment","shopping"],
      words:["shirt","tshirt","t shirt","pants","trousers","jeans","shorts","dress","skirt","kurta","kurti",
        "saree","salwar","suit","blazer","jacket","hoodie","sweater","sweatshirt","socks","innerwear",
        "underwear","pyjama","pyjamas","nightwear","shoes","sneakers","sandals","slippers","heels","boots",
        "belt","cap","scarf","tie","handbag","backpack","wallet","sunglasses","jewellery","jewelry",
        "earrings","necklace","bracelet","zara","uniqlo","namshi","shein","splash","max fashion",
        "centrepoint","adidas","nike","puma","tailor","alteration"]},
    health:{names:["health","medical","medicine","pharmacy","doctor","clinic","hospital","wellness"],
      words:["pharmacy","medicine","medicines","tablets","doctor","clinic","hospital","dentist","dental",
        "checkup","check up","consultation","xray","x ray","blood test","vaccine","physio","therapy",
        "optician","spectacles","contact lens","supplements","vitamins","panadol","bandage","first aid",
        "life pharmacy","aster","medcare","insurance card"]},
    beauty:{names:["beauty","grooming","personal care","salon","spa","self care","barber"],
      words:["haircut","hair cut","barber","salon","spa","massage","facial","manicure","pedicure","waxing",
        "threading","shave","beard","makeup","skincare","moisturizer","sunscreen","perfume","deodorant",
        "hair colour","hair color","nails"]},
    fitness:{names:["fitness","gym","sport","sports","workout","exercise"],
      words:["gym","membership","fitness","workout","protein","whey","trainer","yoga","pilates","crossfit",
        "padel","football","cricket","badminton","swimming","running","cycling","whoop","fitness first"]},
    pets:{names:["pet","pets","dog","cat","animal"],
      words:["vet","veterinary","puppy","kitten","litter","pet food","kibble","leash","collar","pet shop",
        "aquarium","fish food"]},
    fun:{names:["entertainment","fun","leisure","movies","outing","hobby","hobbies","going out"],
      words:["movie","movies","cinema","vox","novo","reel cinemas","concert","theatre","arcade","bowling",
        "karting","museum","waterpark","theme park","global village","tickets","ticket","playstation",
        "xbox","steam","game","games"]},
    education:{names:["education","study","school","college","course","learning","books"],
      words:["book","books","course","tuition","class","classes","exam","fees","stationery","notebook",
        "printing","udemy","coursera","kindle","library","semester","university"]},
    tech:{names:["tech","technology","gadget","gadgets","electronics","devices"],
      words:["phone","iphone","laptop","macbook","charger","cable","adapter","headphones","airpods",
        "earbuds","mouse","keyboard","monitor","powerbank","screen protector","sharaf dg","jumbo","emax",
        "apple store"]},
    kids:{names:["kid","kids","children","baby","child"],
      words:["diapers","diaper","toys","stroller","formula","wipes","school bag"]},
    charity:{names:["charity","donation","zakat","giving"],
      words:["donation","charity","zakat","sadaqah","temple","mosque","church","offering"]}
  };

  function conceptFor(label){
    var l = String(label).toLowerCase();
    for(var k in CONCEPTS){
      var names = CONCEPTS[k].names;
      for(var i=0;i<names.length;i++){ if(l.indexOf(names[i]) > -1) return k; }
    }
    return null;
  }

  function pad(n){ return String(n).length < 2 ? "0"+n : String(n); }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function mkey(y,m){ return y+"-"+pad(m+1); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var SEED = [
    {name:"Crunch dessert",      amount:31,    category:"food"},
    {name:"Gift for Arnav",      amount:36.95, category:"gift"},
    {name:"Gift for Mehzif",     amount:42,    category:"gift"},
    {name:"Pooja oil",           amount:15,    category:"grocery"},
    {name:"Car wash",            amount:45,    category:"car"},
    {name:"McDonald's",          amount:17,    category:"food"},
    {name:"Chewing gum",         amount:10.5,  category:"grocery"},
    {name:"Ice tea and chips",   amount:6,     category:"grocery"},
    {name:"Chips and chocolate", amount:8,     category:"grocery"}
  ];

  var memory = null, storageOk = true;
  function read(){
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ storageOk = false; return memory; }
  }
  function write(v){
    memory = v;
    try { localStorage.setItem(KEY, JSON.stringify(v)); return true; }
    catch(e){ storageOk = false; return false; }
  }

  var today = new Date();
  var db = read();
  if(Array.isArray(db)) db = {items: db};
  if(!db || !db.items){
    var stamp = iso(today);
    db = {items: SEED.map(function(s,i){
      return {id:"s"+i, name:s.name, amount:s.amount, category:s.category, date:stamp};
    })};
  }
  if(!db.rules) db.rules = {};
  if(!db.cats || !db.cats.length) db.cats = DEFAULT_CATS.map(function(c){ return {id:c.id,label:c.label,color:c.color}; });
  if(typeof db.budget === "undefined") db.budget = null;   // applies to every month
  if(!db.budgets) db.budgets = {};                          // per-month overrides
  // Re-step the built-in colours to the checked palette, keeping any you renamed.
  if(db.palette !== 2){
    DEFAULT_CATS.forEach(function(d){
      db.cats.forEach(function(c){ if(c.id === d.id) c.color = d.color; });
    });
    db.palette = 2;
  }
  write(db);

  function budgetFor(key){
    if(db.budgets && typeof db.budgets[key] === "number") return db.budgets[key];
    return (typeof db.budget === "number") ? db.budget : null;
  }
  function totalFor(key){
    return db.items.reduce(function(s,e){
      return e.date.slice(0,7) === key ? s + e.amount : s;
    }, 0);
  }
  function monthsBack(n, endY, endM){
    var out = [];
    for(var i = n-1; i >= 0; i--){
      var d = new Date(endY, endM - i, 1);
      out.push({y:d.getFullYear(), m:d.getMonth(),
                key:mkey(d.getFullYear(), d.getMonth()),
                label:MONTHS[d.getMonth()].slice(0,3)});
    }
    out.forEach(function(x){ x.total = totalFor(x.key); });
    return out;
  }

  function catOf(id){
    for(var i=0;i<db.cats.length;i++){ if(db.cats[i].id===id) return db.cats[i]; }
    return {id:id, label:"Other", color:"#8B9A93"};
  }
  function hasCat(id){
    for(var i=0;i<db.cats.length;i++){ if(db.cats[i].id===id) return true; }
    return false;
  }
  function nextColor(){
    var used = db.cats.map(function(c){ return c.color; });
    for(var i=0;i<PALETTE.length;i++){ if(used.indexOf(PALETTE[i]) === -1) return PALETTE[i]; }
    return PALETTE[db.cats.length % PALETTE.length];
  }

  function clean(text){
    return (" " + text.toLowerCase() + " ").replace(/[^a-z0-9. ]/g," ").replace(/\s+/g," ");
  }
  function hasWord(t, kw){
    if(kw.indexOf(" ") > -1) return t.indexOf(kw) > -1;
    var toks = t.trim().split(" ");
    for(var i=0;i<toks.length;i++){
      var w = toks[i];
      if(w === kw) return true;
      if(kw.length >= 4 && w.indexOf(kw) === 0) return true;
      if(kw.length >= 5 && w.indexOf(kw) > -1) return true;
    }
    return false;
  }
  // Returns a category id, or null when it genuinely can't tell.
  function guessCat(text){
    var t = clean(text);
    for(var learned in db.rules){
      if(hasWord(t, learned) && hasCat(db.rules[learned])) return db.rules[learned];
    }
    // Categories you made yourself, matched on the vocabulary their name implies.
    for(var c=0;c<db.cats.length;c++){
      var cat = db.cats[c];
      if(RULES[cat.id]) continue;
      var k = conceptFor(cat.label);
      if(!k) continue;
      var cw = CONCEPTS[k].words;
      for(var w=0;w<cw.length;w++){ if(hasWord(t, cw[w])) return cat.id; }
    }
    for(var i=0;i<ORDER.length;i++){
      if(!hasCat(ORDER[i])) continue;
      var list = RULES[ORDER[i]];
      for(var j=0;j<list.length;j++){ if(hasWord(t, list[j])) return ORDER[i]; }
    }
    return null;
  }
  function parseEntry(text){
    var t = text.replace(/\b(aed|dhs|dhrs|dh|dirhams?)\b/gi, " ");
    var nums = t.match(/\d+(\.\d+)?/g);
    var amount = null, name = t;
    if(nums && nums.length){
      var last = nums[nums.length-1];
      amount = parseFloat(last);
      var at = t.lastIndexOf(last);
      name = t.slice(0, at) + t.slice(at + last.length);
    }
    name = name.replace(/[-\u2013\u2014,:]+/g," ").replace(/\s+/g," ").trim();
    if(name) name = name.charAt(0).toUpperCase() + name.slice(1);
    return {amount: amount, name: name, cat: guessCat(text)};
  }

    h += '<div class="toolrow">'+

  // ---- charts ------------------------------------------------------------
  // Ring of category arcs, 2px surface gaps, tap a slice to read it off.
  function donut(rows, total){
    var SZ = 184, R = 70, SW = 23, C = SZ/2, circ = 2*Math.PI*R, off = 0;
    var h = '<svg viewBox="0 0 '+SZ+' '+SZ+'" width="'+SZ+'" height="'+SZ+'" role="img" aria-label="Spending by category">';
    h += '<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="'+SW+'"/>';
    rows.forEach(function(x){
      var len = circ * (x.total/total);
      var seg = Math.max(len - 2, 1.5);          // 2px surface gap between fills
      var dim = state.pick && state.pick !== x.id;
      h += '<circle class="arc" data-arc="'+x.id+'" cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" '+
           'stroke="'+x.color+'" stroke-width="'+SW+'" stroke-linecap="butt" '+
           'stroke-dasharray="'+seg.toFixed(2)+' '+(circ-seg).toFixed(2)+'" '+
           'stroke-dashoffset="'+(-off).toFixed(2)+'" '+
           'transform="rotate(-90 '+C+' '+C+')" '+
           'style="cursor:pointer'+(dim?';opacity:.28':'')+'"></circle>';
      off += len;
    });
    h += '</svg>';
    return h;
  }

  // Six months of totals. Budget drawn as a dashed rule so you can see the line.
  function trend(ms, bud){
    var W = 320, H = 132, L = 4, R = 4, TOP = 20, BASE = H - 20;
    var vals = ms.map(function(m){ return m.total; });
    var peak = Math.max.apply(null, vals.concat(bud ? [bud] : []).concat([1]));
    var span = (W - L - R) / ms.length;
    var bw = Math.min(span - 10, 38);
    var h = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly totals" '+
            'style="width:100%;height:auto;display:block;overflow:visible">';
    h += '<line x1="0" y1="'+BASE+'" x2="'+W+'" y2="'+BASE+'" stroke="var(--line)" stroke-width="1"/>';
    if(bud){
      var by = TOP + (BASE-TOP) * (1 - bud/peak);
      h += '<line x1="0" y1="'+by.toFixed(1)+'" x2="'+W+'" y2="'+by.toFixed(1)+'" stroke="var(--muted)" '+
           'stroke-width="1" stroke-dasharray="3 3"/>';
    }
    ms.forEach(function(m,i){
      var cx = L + span*i + span/2;
      var bh = Math.max((BASE-TOP) * (m.total/peak), m.total > 0 ? 3 : 0);
      var y = BASE - bh;
      var cur = (m.y === state.y && m.m === state.m);
      var col = bud && m.total > bud ? "var(--flag)" : (cur ? "var(--ink)" : "var(--muted)");
      if(bh > 0){
        h += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" '+
             'rx="4" fill="'+col+'" opacity="'+(cur?1:0.55)+'"/>';
      }
      h += '<text x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" '+
           'font-size="10" font-family="ui-monospace,Menlo,monospace" fill="var(--muted)" '+
           'stroke="var(--paper)" stroke-width="3" paint-order="stroke">'+
           (m.total ? Math.round(m.total) : '')+'</text>';
      h += '<text x="'+cx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" '+
           'font-size="10" font-family="ui-monospace,Menlo,monospace" fill="var(--muted)" '+
           'opacity="'+(cur?1:0.7)+'">'+m.label+'</text>';
    });
    h += '</svg>';
    return h;
  }

  function insightsHTML(){

                      .filter(function(c){ return c.total > 0; })

    var sel = state.pick ? rows.filter(function(r){ return r.id === state.pick; })[0] : null;

    // A few numbers worth knowing, stated rather than plotted.

    var daysLeft = isCur ? (dim2 - now.getDate() + 1) : 0;

         '<div><div class="k">Biggest</div><div class="v">'+big.amount.toFixed(0)+'</div></div>'+
         '<div><div class="k">Top</div><div class="v" style="font-size:13px">'+esc(top.label)+'</div></div>'+
         '</div>';

    if(bud){
      var msg;
      if(total > bud){
        msg = 'You are AED '+(total-bud).toFixed(2)+' over your '+bud.toFixed(0)+' budget.';
      } else if(isCur && daysLeft > 0){
        msg = 'AED '+(bud-total).toFixed(2)+' left with '+daysLeft+' day'+(daysLeft===1?'':'s')+
              ' to go &mdash; about '+((bud-total)/daysLeft).toFixed(0)+' a day.';
      } else {
        msg = 'AED '+(bud-total).toFixed(2)+' under the '+bud.toFixed(0)+' budget.';
      }
      h += '<div class="hint" style="margin-top:14px">'+msg+'</div>';

    h += '<div class="sechead">Last 6 months</div>';

      var avg = past.reduce(function(s,m){ return s+m.total; },0) / past.length;
      h += '<div class="hint" style="margin-top:10px">Average over the months you have logged: AED '+avg.toFixed(2)+
           (bud ? ' &middot; dashed line is your budget.' : '.')+'</div>';
    }
    h += '</div></div>';
    return h;
  }

  function addCategory(name, thenSelect){
    name = (name||"").trim();
    if(!name) return false;
    for(var i=0;i<db.cats.length;i++){
      if(db.cats[i].label.toLowerCase() === name.toLowerCase()){
        if(thenSelect){ state.auto = false; state.cat = db.cats[i].id; }
        return true;
      }
    }
    var c = {id:"c"+Date.now(), label:name, color:nextColor()};
    db.cats.push(c);
    if(thenSelect){ state.auto = false; state.cat = c.id; }
    save();
    return true;
  }

  function wire(){
    document.querySelectorAll("[data-nav]").forEach(function(b){
      b.onclick = function(){
        var d = new Date(state.y, state.m + (+b.dataset.nav), 1);
        state.y = d.getFullYear(); state.m = d.getMonth();
        state.filter = null; state.openRow = null; render();
      };
    });
    document.querySelectorAll("[data-cat]").forEach(function(b){
      b.onclick = function(){
        state.filter = state.filter === b.dataset.cat ? null : b.dataset.cat;
        state.openRow = null; render();
      };
    });
    document.querySelectorAll("[data-row]").forEach(function(b){
      b.onclick = function(){
        state.openRow = state.openRow === b.dataset.row ? null : b.dataset.row; render();
      };
    });
    document.querySelectorAll("[data-del]").forEach(function(b){
      b.onclick = function(){
        db.items = db.items.filter(function(e){ return e.id !== b.dataset.del; });
        state.openRow = null; save(); render();
      };
    });

    var add = document.getElementById("add");
    if(add) add.onclick = function(){
      var now = new Date();
      var inMonth = mkey(now.getFullYear(), now.getMonth()) === mkey(state.y, state.m);
      state.text = ""; state.cat = null; state.auto = true;
      state.adding = false; state.newName = "";
      state.date = inMonth ? iso(now) : mkey(state.y,state.m)+"-01";
      state.sheet = true; render();
      var el = document.getElementById("entry"); if(el) el.focus();
    };

    var ec = document.getElementById("editcats");
    if(ec) ec.onclick = function(){ state.catSheet = true; render(); };

    // ---- insights
    var oi = document.getElementById("oinsights");
    if(oi) oi.onclick = function(){ state.insights = true; state.pick = null; render(); };
    var ic = document.getElementById("inclose");
    if(ic) ic.onclick = function(){ state.insights = false; state.pick = null; render(); };
    var isc = document.getElementById("inscrim");
    if(isc) isc.onclick = function(ev){
      if(ev.target === isc){ state.insights = false; state.pick = null; render(); }
    };
    document.querySelectorAll("[data-arc]").forEach(function(el){
      el.onclick = function(){
        state.pick = state.pick === el.getAttribute("data-arc") ? null : el.getAttribute("data-arc");
        render();
      };
    });

    // ---- search
    var os = document.getElementById("osearch");
    if(os) os.onclick = function(){
      state.search = true; state.q = ""; render();
      var el = document.getElementById("q"); if(el) el.focus();
    };
    var qc = document.getElementById("qclose");
    if(qc) qc.onclick = function(){ state.search = false; render(); };
    var qsc = document.getElementById("qscrim");
    if(qsc) qsc.onclick = function(ev){ if(ev.target === qsc){ state.search = false; render(); } };
    var qi = document.getElementById("q");
    if(qi){
      qi.oninput = function(){
        var pos = this.selectionStart;
        state.q = this.value;
        render();
        var again = document.getElementById("q");
        if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
      };
    }

    // ---- budget
    var ob = document.getElementById("obudget");
    if(ob) ob.onclick = function(){
      var cur = budgetFor(mkey(state.y, state.m));
      state.bAmt = cur ? String(cur) : "";
      state.bScope = (db.budgets && typeof db.budgets[mkey(state.y,state.m)] === "number") ? "one" : "all";
      state.budgetSheet = true; render();
      var el = document.getElementById("bamt"); if(el) el.focus();
    };
    var bc = document.getElementById("bclose");
    if(bc) bc.onclick = function(){ state.budgetSheet = false; render(); };
    var bsc = document.getElementById("bscrim");
    if(bsc) bsc.onclick = function(ev){ if(ev.target === bsc){ state.budgetSheet = false; render(); } };
    var ba = document.getElementById("bamt");
    if(ba){
      ba.oninput = function(){
        this.value = this.value.replace(/[^0-9.]/g, "");
        state.bAmt = this.value;
        var b = document.getElementById("bsave");
        if(b) b.disabled = !(parseFloat(this.value) > 0);
      };
      ba.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); saveBudget(); } };
    }
    document.querySelectorAll("[data-scope]").forEach(function(b){
      b.onclick = function(){ state.bScope = b.getAttribute("data-scope"); render(); };
    });
    var bs = document.getElementById("bsave");
    if(bs) bs.onclick = saveBudget;
    var bclr = document.getElementById("bclear");
    if(bclr) bclr.onclick = function(){
      var k = mkey(state.y, state.m);
      if(db.budgets) delete db.budgets[k];
      db.budget = null;
      state.budgetSheet = false; save(); render();
    };

    var cancel = document.getElementById("cancel");
    if(cancel) cancel.onclick = function(){ state.sheet = false; render(); };
    var scrim = document.getElementById("scrim");
    if(scrim) scrim.onclick = function(ev){ if(ev.target === scrim){ state.sheet = false; render(); } };

    var entry = document.getElementById("entry");
    if(entry){
      entry.oninput = function(){ state.text = this.value; refreshSheet(); };
      entry.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); commit(); } };
    }
    var date = document.getElementById("date");
    if(date) date.onchange = function(){ state.date = this.value; };

    document.querySelectorAll("[data-pick]").forEach(function(b){
      b.onclick = function(){ state.auto = false; state.cat = b.dataset.pick; refreshSheet(); };
    });

    var addcat = document.querySelector("[data-addcat]");
    if(addcat) addcat.onclick = function(){ state.adding = true; state.newName = ""; render();
      var el = document.getElementById("newname"); if(el) el.focus(); };

    var nn = document.getElementById("newname");
    if(nn){
      nn.oninput = function(){ state.newName = this.value; };
      nn.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); doCreate(); } };
    }
    var cc = document.getElementById("createcat");
    if(cc) cc.onclick = doCreate;

    var sb = document.getElementById("savebtn");
    if(sb) sb.onclick = commit;

    // categories sheet
    document.querySelectorAll("[data-catid]").forEach(function(inp){
      inp.onchange = function(){
        var v = this.value.trim();
        if(!v){ this.value = catOf(inp.dataset.catid).label; return; }
        db.cats.forEach(function(c){ if(c.id === inp.dataset.catid) c.label = v; });
        save();
      };
    });
    document.querySelectorAll("[data-killcat]").forEach(function(b){
      b.onclick = function(){
        db.cats = db.cats.filter(function(c){ return c.id !== b.dataset.killcat; });
        for(var k in db.rules){ if(db.rules[k] === b.dataset.killcat) delete db.rules[k]; }
        save(); render();
      };
    });
    var done = document.getElementById("catdone");
    if(done) done.onclick = function(){ state.catSheet = false; render(); };
    var cs = document.getElementById("catscrim");
    if(cs) cs.onclick = function(ev){ if(ev.target === cs){ state.catSheet = false; render(); } };
    var nn2 = document.getElementById("newname2");
    var cc2 = document.getElementById("createcat2");
    function doCreate2(){
      var el = document.getElementById("newname2");
      if(el && addCategory(el.value, false)) render();
    }
    if(cc2) cc2.onclick = doCreate2;
    if(nn2) nn2.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); doCreate2(); } };
  }

  function saveBudget(){
    var amt = parseFloat(state.bAmt);
    if(!(amt > 0)) return;
    amt = Math.round(amt * 100) / 100;
    var k = mkey(state.y, state.m);
    if(state.bScope === "one"){
      db.budgets[k] = amt;
    } else {
      db.budget = amt;
      delete db.budgets[k];
    }
    state.budgetSheet = false;
    save(); render();
  }

  function doCreate(){
    if(addCategory(state.newName, true)){ state.adding = false; state.newName = ""; render(); }
  }

  function commit(){
    var p = parseEntry(state.text);
    var cat = state.auto ? p.cat : state.cat;
    if(!(p.amount > 0) || !p.name || !cat) return;

    // If you picked the category yourself, remember every word in it for next time.
    if(!state.auto){
      var STOP = ["for","and","the","with","from","this","that","was","were","some","new","one","two",
                  "aed","dhs","paid","bought","got","had"];
      var toks = clean(p.name).trim().split(" ").filter(function(w){
        return w.length > 2 && STOP.indexOf(w) === -1 && !/^\d/.test(w);
      });
      toks.forEach(function(w){ db.rules[w] = cat; });
      if(toks.length > 1) db.rules[toks.join(" ")] = cat;   // the whole name too
    }

    db.items.unshift({
      id: String(Date.now()),
      name: p.name,
      amount: Math.round(p.amount * 100) / 100,
      category: cat,
      date: state.date
    });
    var d = state.date.split("-");
    state.y = +d[0]; state.m = +d[1]-1;
    state.sheet = false; state.filter = null;
    save(); render();
  }

  render();
})();
</script>
<script>
/* Keep a copy of the app on the phone for offline use. */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* still works online */ });
  });
}
</script>
