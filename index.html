<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spend</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spend">
<meta name="theme-color" content="#E9ECE4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --paper:#E9ECE4; --card:#F8F9F4; --ink:#122720; --inkSoft:#42574E;
    --muted:#8B9A93; --line:#D5DACE; --accent:#1F6F5C; --flag:#8C3B26;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{font-family:var(--sans); color:var(--ink); min-height:100vh; min-height:100dvh;
    padding-top:env(safe-area-inset-top); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer;color:inherit;}
  input{font-family:inherit;}
  input:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .wrap{max-width:460px;margin:0 auto;}

  .head{padding:24px 20px 20px;}
  .navrow{display:flex;align-items:center;justify-content:space-between;}
  .navbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--inkSoft);font-size:20px;line-height:1;}
  .monthlbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--inkSoft);text-transform:uppercase;}
  .totalrow{margin-top:28px;display:flex;align-items:baseline;justify-content:center;}
  .cur{font-family:var(--mono);font-size:15px;color:var(--muted);margin-right:8px;}
  .big{font-family:var(--mono);font-size:54px;letter-spacing:-.03em;line-height:1;}
  .fils{font-family:var(--mono);font-size:24px;color:var(--muted);}
  .count{text-align:center;margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);}

  .bar{display:flex;gap:2px;height:10px;margin-top:24px;}
  .seg{border-radius:5px;min-width:6px;transition:opacity .15s;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .chip{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--inkSoft);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--card);}
  .chip.ask{border-color:var(--flag);color:var(--flag);border-style:dashed;}
  .chip .amt{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .chip.on .amt{color:var(--card);}
  .dot{width:7px;height:7px;border-radius:4px;flex-shrink:0;}
  .editcats{display:block;margin:14px auto 0;font-size:12px;color:var(--muted);text-decoration:underline;}

  .list{padding:0 20px 130px;}
  .daygrp{margin-bottom:20px;}
  .dayhead{display:flex;justify-content:space-between;padding:0 4px 8px;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);}
  .cardbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;}
  .del{padding:0 16px 12px;}
  .rowsep{border-top:1px solid var(--line);}
  .rname{flex:1;font-size:15px;}
  .rcat{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .ramt{font-family:var(--mono);font-size:15px;}
  .delbtn{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);color:var(--flag);font-size:13px;}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 24px;text-align:center;}
  .empty .t{font-size:15px;margin-bottom:6px;}
  .empty .s{font-size:13px;color:var(--muted);}
  .warn{margin:0 20px 12px;padding:12px 16px;border-radius:12px;background:#F6E3DE;color:var(--flag);font-size:13px;}

  .footer{position:fixed;left:0;right:0;bottom:0;padding:32px 20px calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 55%, rgba(233,236,228,0));}
  .addbtn{display:block;width:100%;max-width:420px;margin:0 auto;padding:16px;border-radius:16px;
    background:var(--ink);color:var(--card);font-size:15px;}

  .scrim{position:fixed;inset:0;background:rgba(18,39,32,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{width:100%;max-width:460px;background:var(--paper);border-radius:24px 24px 0 0;
    padding:20px 20px calc(28px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .sheettitle{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--inkSoft);}
  .cancel{font-size:14px;color:var(--muted);}
  .readout{display:flex;align-items:baseline;justify-content:center;margin-bottom:18px;}
  .readout .big{font-size:44px;}
  .muted-num{color:var(--muted);}
  #entry{width:100%;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:16px;color:var(--ink);outline:none;}
  .hint{font-size:12px;color:var(--muted);margin:8px 2px 16px;line-height:1.45;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin:0 2px 8px;}
  .eyebrow.ask{color:var(--flag);}
  .field{width:100%;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:16px;color:var(--ink);outline:none;margin-bottom:16px;}
  #date{font-family:var(--mono);}
  .savebtn{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:var(--card);font-size:15px;}
  .savebtn:disabled{background:var(--line);color:var(--muted);}

  .newrow{display:flex;gap:8px;margin:10px 0 16px;}
  .newrow input{flex:1;padding:12px 14px;border-radius:12px;background:var(--card);
    border:1px solid var(--line);font-size:16px;color:var(--ink);outline:none;}
  .newrow button{padding:0 18px;border-radius:12px;background:var(--accent);color:var(--card);font-size:14px;}
  .catrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .catrow input{flex:1;padding:10px 12px;border-radius:10px;background:var(--card);
    border:1px solid var(--line);font-size:16px;color:var(--ink);outline:none;}
  .catrow .used{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .catrow .kill{width:30px;height:30px;border-radius:15px;border:1px solid var(--line);color:var(--flag);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  var KEY = "expenses:v1";

  var DEFAULT_CATS = [
    {id:"grocery", label:"Groceries",    color:"#1F6F5C"},
    {id:"food",    label:"Food",         color:"#E0912B"},
    {id:"gift",    label:"Gifts",        color:"#B4553F"},
    {id:"car",     label:"Car & travel", color:"#3C5A78"},
    {id:"home",    label:"Home & bills", color:"#7A5A8C"},
    {id:"other",   label:"Other",        color:"#8B9A93"}
  ];
  var PALETTE = ["#4E7A9B","#A0693F","#5E8C61","#8C5A7A","#3F7A78","#9B7B3F","#6E6A9B","#7D8C4F"];

  var MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
  var WEEK = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  var RULES = {
    grocery:["grocery","groceries","supermarket","carrefour","lulu","spinneys","choithrams","waitrose",
             "union coop","nesto","viva","almaya","west zone","zoom","baqala","milk","bread","eggs","rice",
             "oil","atta","flour","sugar","salt","vegetables","veggies","fruits","veg","chips","chocolate",
             "chocolates","gum","chewing","snacks","biscuit","biscuits","yogurt","curd","paneer","chicken",
             "meat","fish","tissue","detergent","shampoo","soap","toothpaste","water bottle","ice tea",
             "iced tea","pooja","agarbatti","dates"],
    food:["food","restaurant","lunch","dinner","breakfast","brunch","dessert","crunch","cake","pastry",
          "ice cream","icecream","mcd","mcdonald","mcdonalds","kfc","burger","pizza","subway","shawarma",
          "biryani","sushi","ramen","noodles","dumpling","thai","chinese","indian","arabic","grill",
          "cafe","coffee","matcha","latte","starbucks","costa","tim hortons","arabica","boba","bubble tea",
          "juice","smoothie","shake","talabat","deliveroo","zomato","snack","dine","takeaway","bakery",
          "donut","croissant"],
    gift:["gift","gifts","present","birthday","anniversary","wedding","farewell","souvenir","flowers",
          "bouquet"],
    car:["car","fuel","petrol","diesel","adnoc","enoc","eppco","emarat","salik","parking","rta","nol",
         "metro","taxi","careem","uber","bolt","wash","car wash","tyre","tyres","tire","oil change",
         "garage","mechanic","battery","registration","mulkiya","toll","obd","number plate","tinting",
         "flight","hotel","visa"],
    home:["rent","dewa","electricity","water bill","internet","wifi","etisalat","bill","furniture","ikea",
          "home centre","cleaning","laundry","dry clean","maid","cylinder","bulb","curtains","mattress",
          "pillow","plumber","ac service","subscription","netflix","spotify","icloud","storage"]
  };
  var ORDER = ["gift","car","food","grocery","home"];

  function pad(n){ return String(n).length < 2 ? "0"+n : String(n); }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function mkey(y,m){ return y+"-"+pad(m+1); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var SEED = [
    {name:"Crunch dessert",      amount:31,    category:"food"},
    {name:"Gift for Arnav",      amount:36.95, category:"gift"},
    {name:"Gift for Mehzif",     amount:42,    category:"gift"},
    {name:"Pooja oil",           amount:15,    category:"grocery"},
    {name:"Car wash",            amount:45,    category:"car"},
    {name:"McDonald's",          amount:17,    category:"food"},
    {name:"Chewing gum",         amount:10.5,  category:"grocery"},
    {name:"Ice tea and chips",   amount:6,     category:"grocery"},
    {name:"Chips and chocolate", amount:8,     category:"grocery"}
  ];

  var memory = null, storageOk = true;
  function read(){
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ storageOk = false; return memory; }
  }
  function write(v){
    memory = v;
    try { localStorage.setItem(KEY, JSON.stringify(v)); return true; }
    catch(e){ storageOk = false; return false; }
  }

  var today = new Date();
  var db = read();
  if(Array.isArray(db)) db = {items: db};
  if(!db || !db.items){
    var stamp = iso(today);
    db = {items: SEED.map(function(s,i){
      return {id:"s"+i, name:s.name, amount:s.amount, category:s.category, date:stamp};
    })};
  }
  if(!db.rules) db.rules = {};
  if(!db.cats || !db.cats.length) db.cats = DEFAULT_CATS.map(function(c){ return {id:c.id,label:c.label,color:c.color}; });
  write(db);

  function catOf(id){
    for(var i=0;i<db.cats.length;i++){ if(db.cats[i].id===id) return db.cats[i]; }
    return {id:id, label:"Other", color:"#8B9A93"};
  }
  function hasCat(id){
    for(var i=0;i<db.cats.length;i++){ if(db.cats[i].id===id) return true; }
    return false;
  }
  function nextColor(){
    var used = db.cats.map(function(c){ return c.color; });
    for(var i=0;i<PALETTE.length;i++){ if(used.indexOf(PALETTE[i]) === -1) return PALETTE[i]; }
    return PALETTE[db.cats.length % PALETTE.length];
  }

  function clean(text){
    return (" " + text.toLowerCase() + " ").replace(/[^a-z0-9. ]/g," ").replace(/\s+/g," ");
  }
  function hasWord(t, kw){
    if(kw.indexOf(" ") > -1) return t.indexOf(kw) > -1;
    var toks = t.trim().split(" ");
    for(var i=0;i<toks.length;i++){
      var w = toks[i];
      if(w === kw) return true;
      if(kw.length >= 4 && w.indexOf(kw) === 0) return true;
      if(kw.length >= 5 && w.indexOf(kw) > -1) return true;
    }
    return false;
  }
  // Returns a category id, or null when it genuinely can't tell.
  function guessCat(text){
    var t = clean(text);
    for(var learned in db.rules){
      if(hasWord(t, learned) && hasCat(db.rules[learned])) return db.rules[learned];
    }
    for(var i=0;i<ORDER.length;i++){
      if(!hasCat(ORDER[i])) continue;
      var list = RULES[ORDER[i]];
      for(var j=0;j<list.length;j++){ if(hasWord(t, list[j])) return ORDER[i]; }
    }
    return null;
  }
  function parseEntry(text){
    var t = text.replace(/\b(aed|dhs|dhrs|dh|dirhams?)\b/gi, " ");
    var nums = t.match(/\d+(\.\d+)?/g);
    var amount = null, name = t;
    if(nums && nums.length){
      var last = nums[nums.length-1];
      amount = parseFloat(last);
      var at = t.lastIndexOf(last);
      name = t.slice(0, at) + t.slice(at + last.length);
    }
    name = name.replace(/[-\u2013\u2014,:]+/g," ").replace(/\s+/g," ").trim();
    if(name) name = name.charAt(0).toUpperCase() + name.slice(1);
    return {amount: amount, name: name, cat: guessCat(text)};
  }

  var state = {
    y: today.getFullYear(), m: today.getMonth(),
    filter: null, openRow: null,
    sheet: false, catSheet: false,
    text: "", cat: null, auto: true, date: iso(today),
    adding: false, newName: ""
  };

  function save(){ if(!write(db)) render(); }

  function render(){
    var key = mkey(state.y, state.m);
    var items = db.items.filter(function(e){ return e.date.slice(0,7) === key; });
    var total = items.reduce(function(s,e){ return s + e.amount; }, 0);

    var sums = {};
    items.forEach(function(e){ sums[e.category] = (sums[e.category]||0) + e.amount; });
    var byCat = db.cats.map(function(c){ return {id:c.id,label:c.label,color:c.color,total:sums[c.id]||0}; })
                       .filter(function(c){ return c.total > 0; });

    var visible = state.filter ? items.filter(function(e){ return e.category === state.filter; }) : items;
    var groups = {};
    visible.forEach(function(e){ (groups[e.date] = groups[e.date] || []).push(e); });
    var dates = Object.keys(groups).sort().reverse();

    var parts = total.toFixed(2).split(".");
    var h = "";

    h += '<div class="head">';
    h +=   '<div class="navrow">';
    h +=     '<button class="navbtn" data-nav="-1" aria-label="Previous month">&lsaquo;</button>';
    h +=     '<div class="monthlbl">'+MONTHS[state.m]+' '+state.y+'</div>';
    h +=     '<button class="navbtn" data-nav="1" aria-label="Next month">&rsaquo;</button>';
    h +=   '</div>';
    h +=   '<div class="totalrow"><span class="cur">AED</span><span class="big">'+parts[0]+'</span><span class="fils">.'+parts[1]+'</span></div>';
    h +=   '<div class="count">'+items.length+' '+(items.length===1?"ENTRY":"ENTRIES")+'</div>';

    if(byCat.length){
      h += '<div class="bar">';
      byCat.forEach(function(c){
        var dim = state.filter && state.filter !== c.id ? ";opacity:.25" : "";
        h += '<button class="seg" data-cat="'+c.id+'" aria-label="'+esc(c.label)+'" style="width:'+((c.total/total)*100)+'%;background:'+c.color+dim+'"></button>';
      });
      h += '</div><div class="chips">';
      byCat.forEach(function(c){
        h += '<button class="chip'+(state.filter===c.id?' on':'')+'" data-cat="'+c.id+'">'+
             '<span class="dot" style="background:'+c.color+'"></span>'+esc(c.label)+
             '<span class="amt">'+c.total.toFixed(2)+'</span></button>';
      });
      h += '</div>';
    }
    h += '<button class="editcats" id="editcats">Edit categories</button>';
    h += '</div>';

    if(!storageOk){
      h += '<div class="warn">This browser is blocking saved data, so entries will disappear when you close the tab. Open the page in Safari directly to fix it.</div>';
    }

    h += '<div class="list">';
    if(!dates.length){
      h += '<div class="empty"><div class="t">Nothing logged for '+MONTHS[state.m]+' yet.</div>'+
           '<div class="s">Tap Add expense to start this month.</div></div>';
    } else {
      dates.forEach(function(d){
        var g = groups[d], p = d.split("-");
        var dt = new Date(+p[0], +p[1]-1, +p[2]);
        var lbl = (WEEK[dt.getDay()]+" "+(+p[2])+" "+MONTHS[+p[1]-1].slice(0,3)).toUpperCase();
        var dayTotal = g.reduce(function(s,e){ return s+e.amount; },0);
        h += '<div class="daygrp"><div class="dayhead"><span>'+lbl+'</span><span>'+dayTotal.toFixed(2)+'</span></div><div class="cardbox">';
        g.forEach(function(e,i){
          var c = catOf(e.category);
          h += '<div class="'+(i?'rowsep':'')+'">';
          h +=   '<button class="row" data-row="'+e.id+'">'+
                 '<span class="dot" style="background:'+c.color+'"></span>'+
                 '<span class="rname">'+esc(e.name)+'<span class="rcat">'+esc(c.label)+'</span></span>'+
                 '<span class="ramt">'+e.amount.toFixed(2)+'</span></button>';
          if(state.openRow === e.id){
            h += '<div class="del"><button class="delbtn" data-del="'+e.id+'">Delete this expense</button></div>';
          }
          h += '</div>';
        });
        h += '</div></div>';
      });
    }
    h += '</div>';

    h += '<div class="footer"><button class="addbtn" id="add">Add expense</button></div>';

    if(state.sheet) h += sheetHTML();
    if(state.catSheet) h += catSheetHTML();

    document.getElementById("app").innerHTML = h;
    wire();
  }

  function sheetHTML(){
    var p = parseEntry(state.text);
    var cat = state.auto ? p.cat : state.cat;
    var unsure = state.auto && !p.cat && p.name.length > 0;
    var ok = p.amount > 0 && p.name.length > 0 && !!cat;
    var a = (p.amount > 0 ? p.amount : 0).toFixed(2).split(".");

    var eyebrow = "CATEGORY";
    if(unsure) eyebrow = "NOT SURE WHAT THIS IS &mdash; PICK ONE";
    else if(state.auto && cat) eyebrow = "CATEGORY &middot; AUTO-PICKED";

    var h = '<div class="scrim" id="scrim"><div class="sheet">';
    h += '<div class="sheethead"><span class="sheettitle">NEW EXPENSE</span><button class="cancel" id="cancel">Cancel</button></div>';
    h += '<div class="readout"><span class="cur">AED</span>'+
         '<span class="big'+(p.amount>0?'':' muted-num')+'">'+a[0]+'</span><span class="fils">.'+a[1]+'</span></div>';
    h += '<input id="entry" placeholder="Car wash 45" value="'+esc(state.text)+'" autocomplete="off" autocapitalize="sentences">';
    h += '<div class="hint">Type it however you like &mdash; &ldquo;McD 17&rdquo;, &ldquo;gift for Arnav 36.95&rdquo;. The number is the amount.</div>';
    h += '<div class="eyebrow'+(unsure?' ask':'')+'">'+eyebrow+'</div>';
    h += '<div class="chips" style="margin-top:0;margin-bottom:16px">';
    db.cats.forEach(function(c){
      h += '<button class="chip'+(cat===c.id?' on':(unsure?' ask':''))+'" data-pick="'+c.id+'" style="padding:7px 11px;font-size:13px">'+
           '<span class="dot" style="background:'+c.color+'"></span>'+esc(c.label)+'</button>';
    });
    h += '<button class="chip" data-addcat="1" style="padding:7px 11px;font-size:13px">+ New category</button>';
    h += '</div>';
    if(state.adding){
      h += '<div class="newrow"><input id="newname" placeholder="Name it, e.g. Pharmacy" value="'+esc(state.newName)+'" autocapitalize="words">'+
           '<button id="createcat">Add</button></div>';
    }
    h += '<input id="date" class="field" type="date" value="'+state.date+'">';
    h += '<button class="savebtn" id="savebtn"'+(ok?"":" disabled")+'>Save expense</button>';
    h += '</div></div>';
    return h;
  }

  function catSheetHTML(){
    var counts = {};
    db.items.forEach(function(e){ counts[e.category] = (counts[e.category]||0)+1; });
    var h = '<div class="scrim" id="catscrim"><div class="sheet">';
    h += '<div class="sheethead"><span class="sheettitle">CATEGORIES</span><button class="cancel" id="catdone">Done</button></div>';
    db.cats.forEach(function(c){
      var n = counts[c.id] || 0;
      h += '<div class="catrow"><span class="dot" style="background:'+c.color+'"></span>'+
           '<input data-catid="'+c.id+'" value="'+esc(c.label)+'" autocapitalize="words">'+
           (n ? '<span class="used">'+n+'</span>'
              : '<button class="kill" data-killcat="'+c.id+'" aria-label="Remove category">&times;</button>')+
           '</div>';
    });
    h += '<div class="newrow" style="margin-top:16px"><input id="newname2" placeholder="Add a category" autocapitalize="words">'+
         '<button id="createcat2">Add</button></div>';
    h += '<div class="hint" style="margin-bottom:0">Rename anything here and it updates everywhere. Categories already used by an expense show how many; empty ones can be removed.</div>';
    h += '</div></div>';
    return h;
  }

  function refreshSheet(){
    var p = parseEntry(state.text);
    var cat = state.auto ? p.cat : state.cat;
    var unsure = state.auto && !p.cat && p.name.length > 0;
    var a = (p.amount > 0 ? p.amount : 0).toFixed(2).split(".");
    var big = document.querySelector(".readout .big");
    var fil = document.querySelector(".readout .fils");
    if(big){ big.textContent = a[0]; big.className = "big" + (p.amount>0 ? "" : " muted-num"); }
    if(fil) fil.textContent = "." + a[1];
    var eb = document.querySelector(".eyebrow");
    if(eb){
      eb.innerHTML = unsure ? "NOT SURE WHAT THIS IS &mdash; PICK ONE"
                   : (state.auto && cat ? "CATEGORY &middot; AUTO-PICKED" : "CATEGORY");
      eb.className = "eyebrow" + (unsure ? " ask" : "");
    }
    document.querySelectorAll("[data-pick]").forEach(function(b){
      b.className = "chip" + (cat === b.dataset.pick ? " on" : (unsure ? " ask" : ""));
    });
    var sb = document.getElementById("savebtn");
    if(sb) sb.disabled = !(p.amount > 0 && p.name.length > 0 && cat);
  }

  function addCategory(name, thenSelect){
    name = (name||"").trim();
    if(!name) return false;
    for(var i=0;i<db.cats.length;i++){
      if(db.cats[i].label.toLowerCase() === name.toLowerCase()){
        if(thenSelect){ state.auto = false; state.cat = db.cats[i].id; }
        return true;
      }
    }
    var c = {id:"c"+Date.now(), label:name, color:nextColor()};
    db.cats.push(c);
    if(thenSelect){ state.auto = false; state.cat = c.id; }
    save();
    return true;
  }

  function wire(){
    document.querySelectorAll("[data-nav]").forEach(function(b){
      b.onclick = function(){
        var d = new Date(state.y, state.m + (+b.dataset.nav), 1);
        state.y = d.getFullYear(); state.m = d.getMonth();
        state.filter = null; state.openRow = null; render();
      };
    });
    document.querySelectorAll("[data-cat]").forEach(function(b){
      b.onclick = function(){
        state.filter = state.filter === b.dataset.cat ? null : b.dataset.cat;
        state.openRow = null; render();
      };
    });
    document.querySelectorAll("[data-row]").forEach(function(b){
      b.onclick = function(){
        state.openRow = state.openRow === b.dataset.row ? null : b.dataset.row; render();
      };
    });
    document.querySelectorAll("[data-del]").forEach(function(b){
      b.onclick = function(){
        db.items = db.items.filter(function(e){ return e.id !== b.dataset.del; });
        state.openRow = null; save(); render();
      };
    });

    var add = document.getElementById("add");
    if(add) add.onclick = function(){
      var now = new Date();
      var inMonth = mkey(now.getFullYear(), now.getMonth()) === mkey(state.y, state.m);
      state.text = ""; state.cat = null; state.auto = true;
      state.adding = false; state.newName = "";
      state.date = inMonth ? iso(now) : mkey(state.y,state.m)+"-01";
      state.sheet = true; render();
      var el = document.getElementById("entry"); if(el) el.focus();
    };

    var ec = document.getElementById("editcats");
    if(ec) ec.onclick = function(){ state.catSheet = true; render(); };

    var cancel = document.getElementById("cancel");
    if(cancel) cancel.onclick = function(){ state.sheet = false; render(); };
    var scrim = document.getElementById("scrim");
    if(scrim) scrim.onclick = function(ev){ if(ev.target === scrim){ state.sheet = false; render(); } };

    var entry = document.getElementById("entry");
    if(entry){
      entry.oninput = function(){ state.text = this.value; refreshSheet(); };
      entry.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); commit(); } };
    }
    var date = document.getElementById("date");
    if(date) date.onchange = function(){ state.date = this.value; };

    document.querySelectorAll("[data-pick]").forEach(function(b){
      b.onclick = function(){ state.auto = false; state.cat = b.dataset.pick; refreshSheet(); };
    });

    var addcat = document.querySelector("[data-addcat]");
    if(addcat) addcat.onclick = function(){ state.adding = true; state.newName = ""; render();
      var el = document.getElementById("newname"); if(el) el.focus(); };

    var nn = document.getElementById("newname");
    if(nn){
      nn.oninput = function(){ state.newName = this.value; };
      nn.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); doCreate(); } };
    }
    var cc = document.getElementById("createcat");
    if(cc) cc.onclick = doCreate;

    var sb = document.getElementById("savebtn");
    if(sb) sb.onclick = commit;

    // categories sheet
    document.querySelectorAll("[data-catid]").forEach(function(inp){
      inp.onchange = function(){
        var v = this.value.trim();
        if(!v){ this.value = catOf(inp.dataset.catid).label; return; }
        db.cats.forEach(function(c){ if(c.id === inp.dataset.catid) c.label = v; });
        save();
      };
    });
    document.querySelectorAll("[data-killcat]").forEach(function(b){
      b.onclick = function(){
        db.cats = db.cats.filter(function(c){ return c.id !== b.dataset.killcat; });
        for(var k in db.rules){ if(db.rules[k] === b.dataset.killcat) delete db.rules[k]; }
        save(); render();
      };
    });
    var done = document.getElementById("catdone");
    if(done) done.onclick = function(){ state.catSheet = false; render(); };
    var cs = document.getElementById("catscrim");
    if(cs) cs.onclick = function(ev){ if(ev.target === cs){ state.catSheet = false; render(); } };
    var nn2 = document.getElementById("newname2");
    var cc2 = document.getElementById("createcat2");
    function doCreate2(){
      var el = document.getElementById("newname2");
      if(el && addCategory(el.value, false)) render();
    }
    if(cc2) cc2.onclick = doCreate2;
    if(nn2) nn2.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); doCreate2(); } };
  }

  function doCreate(){
    if(addCategory(state.newName, true)){ state.adding = false; state.newName = ""; render(); }
  }

  function commit(){
    var p = parseEntry(state.text);
    var cat = state.auto ? p.cat : state.cat;
    if(!(p.amount > 0) || !p.name || !cat) return;

    // If you picked the category yourself, remember the word for next time.
    if(!state.auto && cat !== p.cat){
      var toks = clean(p.name).trim().split(" ").filter(function(w){
        return w.length > 2 && ["for","and","the","with","from"].indexOf(w) === -1;
      });
      if(toks.length) db.rules[toks[0]] = cat;
    }

    db.items.unshift({
      id: String(Date.now()),
      name: p.name,
      amount: Math.round(p.amount * 100) / 100,
      category: cat,
      date: state.date
    });
    var d = state.date.split("-");
    state.y = +d[0]; state.m = +d[1]-1;
    state.sheet = false; state.filter = null;
    save(); render();
  }

  render();
})();
</script>
</body>
</html>
